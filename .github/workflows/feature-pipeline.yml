name: Feature Pipeline

on:
  schedule:
    - cron: '42 * * * *' 
  workflow_dispatch: 

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'auto' }}
          LATITUDE: '25.3792'
          LONGITUDE: '68.3683'
          TIMEZONE: 'Asia/Karachi'
        run: |
          cd src
          python -m features.feature_pipeline

      - name: Send success notification
        if: success()
        run: |
          echo "Feature pipeline completed successfully at $(date)"

      - name: Send failure notification
        if: failure()
        run: |
          echo "Feature pipeline failed at $(date)"
          exit 1
